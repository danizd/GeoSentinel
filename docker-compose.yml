# ⚠️ DEV ONLY — NO ejecutar en producción.
# Este fichero levanta un postgres en el puerto 5432 del host y colisiona con el
# postgres de producción (que ya ocupa ese puerto). En producción usar:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geosentinel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geosentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
[project]
name = "geosentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "geoalchemy2>=0.15.2",
    "psycopg[binary]>=3.3.4",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
